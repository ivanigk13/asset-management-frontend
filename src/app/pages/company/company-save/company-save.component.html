<div id="container" class="container d-flex flex-column justify-content-center align-self-center mt-5">
    <form #formCompany="ngForm" (ngSubmit)="save(formCompany.form.valid)">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-3">Save Company Form</h2>
                <form-input formDivClass="mb-3" formLabelFor="company-name" formLabelClass="card-text" 
                    formLabelValue="Company Name" formInputType="text" formInputId="company-name" 
                    formInputName="company-name" [(formInputNgModel)]="insertCompanyDtoReq.companyName" 
                    formInputPlaceholder="PT. Lawencon" [formInputMin]="1" [formInputMax]="30">
                </form-input>
                <div class="mb-3">
                    <app-label labelFor="company-address" labelClass="card-text" labelValue="Company Address"></app-label>
                    <textarea name="company-address" id="company-address" cols="30" rows="3" required
                        [(ngModel)]="insertCompanyDtoReq.companyAddress" class="form-control" minlength="1">
                    </textarea>
                </div>
                <div class="row">
                    <div class="col-12 col-sm-3">
                        <app-button btnType="submit" btnClass="btn-primary card-link form-control mb-2" btnLabel="SAVE" [btnDisable]="formCompany.form.invalid"></app-button>
                    </div>
                    <div class="col-12 col-sm-3">
                        <app-button btnLink="/company/list" btnClass="btn-danger card-link form-control" btnLabel="CANCEL"></app-button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
