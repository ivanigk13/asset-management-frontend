<div id="container" class="container d-flex flex-column justify-content-center align-self-center mt-5">
    <form #formRole="ngForm" (ngSubmit)="save(formRole.form.valid)">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-3">Save Role Form</h2>
                <form-input formDivClass="mb-3" formLabelFor="code" formLabelClass="card-text" formLabelValue="Role Code" 
                    formInputType="text" formInputId="code" formInputName="code" 
                    [(formInputNgModel)]="insertRoleDtoReq.roleCode" formInputPlaceholder="role code" 
                    [formInputRequired]="true" [formInputMin]="1" [formInputMax]="10">
                </form-input>
                <form-input formDivClass="mb-3" formLabelFor="name" formLabelClass="card-text" formLabelValue="Role Name" 
                    formInputType="text" formInputId="name" formInputName="name" 
                    [(formInputNgModel)]="insertRoleDtoReq.roleName" formInputPlaceholder="role name" 
                    [formInputRequired]="true" [formInputMin]="1" [formInputMax]="12">
                </form-input>
                <div class="row">
                    <div class="col-12 col-sm-3">
                        <app-button btnType="submit" btnClass="btn-primary card-link form-control mb-2" btnLabel="SAVE" [btnDisable]="formRole.form.invalid"></app-button>
                    </div>
                    <div class="col-12 col-sm-3">
                        <app-button btnLink="/role/list" btnClass="btn-danger card-link form-control" btnLabel="CANCEL"></app-button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
