<div class="mt-3 sm-3">
    <h1 class="text-center text-secondary">Checkin List</h1>
</div>

<div class="container">
    <div class="table-responsive mt-3 sm-3">
        <table class="table table-hover table-bordered mt-3">
            <tr>
                <th>No</th>
                <th>Asset Name</th>
                <th>Asset Status Name</th>
                <th>Asset Status Alternative Name</th>
            </tr>
            <tr *ngFor="let checkin of checkins; let i = index">
                <td>{{i+1}}</td>
                <td>{{checkin.assetName}}</td>
                <td>{{checkin.statusName}}</td>
                <td>{{checkin.altName}}</td>
            </tr>
        </table>
    </div>
</div>
