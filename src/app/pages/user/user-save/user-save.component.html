<div id="container" class="container d-flex flex-column justify-content-center align-self-center mt-5">
    <form #formUser="ngForm">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-3">Save User Form</h2>
                <form-select formDivClass="mb-3" formLabelFor="role" formLabelValue="Role Name" 
                    formSelectId="role" formSelectName="role" [formOptionData]="roles" formOptionName="roleName"
                    [(formSelectNgModel)]="insertUserDtoReq.roleId">
                </form-select>
                <form-input formDivClass="mb-3" formLabelFor="username" formLabelClass="card-text" formLabelValue="Username" 
                    formInputType="text" formInputId="username" formInputName="username" [formInputRequired]="true"
                    [(formInputNgModel)]="insertUserDtoReq.username" formInputPlaceholder="username" 
                    [formInputMin]="1" [formInputMax]="20">
                </form-input>
                <form-input formDivClass="mb-3" formLabelFor="email" formLabelClass="card-text" formLabelValue="Email" 
                    formInputType="email" formInputId="email" formInputName="email" 
                    [(formInputNgModel)]="insertUserDtoReq.email" formInputPlaceholder="name@example.com" 
                    [formInputMin]="1" [formInputMax]="50">
                </form-input>
                <div class="row">
                    <div class="col-12 col-sm-3">
                        <app-button (btnClickEvent)="save(formUser.form.valid)" btnClass="btn-primary card-link form-control mb-2" btnLabel="SAVE" [btnDisable]="formUser.form.invalid"></app-button>
                    </div>
                    <div class="col-12 col-sm-3">
                        <app-button btnLink="/user/list" btnClass="btn-danger card-link form-control" btnLabel="CANCEL"></app-button>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
